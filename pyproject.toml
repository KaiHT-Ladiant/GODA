[project]
name = "google-to-domate"
version = "0.1.0"
description = "Local bidirectional sync between Google Calendar and Todomate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "httpx>=0.27.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
google-to-domate = "google_to_domate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
